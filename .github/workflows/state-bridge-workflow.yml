name: State Bridge L2 Testing

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'dev/*' 

jobs:
  build_and_push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install scarb
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.11.4"

      - name: Install Starknet Foundry
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          starknet-foundry-version: "0.44.0"
          
      - name: Check versions
        run: |
          scarb --version
          snforge --version

      - name: Build contract with scarb
        run: |
          cd state_bridge_l2/world_id_state_bridge
          scarb build

      - name: Run tests with snforge
        run: |
          cd state_bridge_l2/world_id_state_bridge
          snforge test 

      - name: Scarb fmt
        run: |
          cd state_bridge_l2/world_id_state_bridge
          scarb fmt --check

      - name: Cargo fmt
        run: |
          cd state_bridge_service
          cargo fmt --check
