[workspace]
resolver = "2"
members = [
    "state_bridge_service",
]

[profiles.debug]
inherits = "dev"
debug = 2
overflow-checks = true
debug-assertions = true
lto = false

[workspace.dependencies]
starknet = "0.14.0"
ethers = { version = "2.0.10", features = [
    "abigen",
    "ws",
    "ipc",
    "rustls",
    "openssl",
] }

eyre = "0.6.9"
tokio = { version = "1.34.0", features = ["rt-multi-thread", "sync", "macros"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.17", features = ["fmt", "env-filter"] } 
ruint = "1.10.1"
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "1.0.49"
dotenv = "0.15.0"
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.21.3"
# Telemetry workspace dependencies
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
prometheus = "0.13"
tokio-util = { version = "0.7", features = ["time"] }