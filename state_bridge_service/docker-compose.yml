# docker-compoe.yml
version: '3.9'

services:
  state-bridge-relay:
    build: .
    env_file: .env
    image: state-bridge-relay:latest
    container_name: state-bridge-relay
    environment:
      RUST_LOG: info
    ports:
      - "9091:9091"  # Expose Prometheus metrics port
    restart: unless-stopped
    volumes:
      - ./config:/app/config

    healthcheck:
      test: ["CMD", "/usr/local/bin/state_bridge_relay", "--healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3